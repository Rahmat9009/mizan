# Cross-machine decision-determinism matrix (Hard Rule A1 / milestone M2).
#
# The product claim is that the same inputs produce a byte-identical verdict, everywhere, always.
# The ways that claim breaks - hash randomisation reordering a map, a locale with a comma decimal
# separator, a timezone shifting a timestamp, a different CPU or interpreter build - are all PROCESS
# or MACHINE properties. No in-process test can see any of them, which is why this workflow exists and
# why it must run on more than one operating system.
#
# HERMETIC. No Alpaca credentials, no network, no broker, no clock. Fakes and fixtures only.
name: determinism

# Private-repo minutes bill macOS at 10x and Windows at 2x, so six cells is roughly 78 billed
# minutes per run against a 2,000/month tier. Only paths that can actually change a verdict trigger
# it; everything else is workflow_dispatch.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mizan/**'
      - 'tests/invariants/**'
      - 'scripts/determinism_fingerprint.py'
      - 'determinism-reference.json'
      - '.github/workflows/determinism.yml'

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: replay ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.12", so 3.11 cannot install this package: it would fail at
        # `pip install -e .` for a packaging reason and tell us nothing about determinism.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ".[dev]" not ".": a bare install omits pytest and hypothesis, so the invariant step would
      # fail with "no module named pytest" and tell us nothing about determinism.
      - name: install
        run: python -m pip install -e ".[dev]"

      - name: invariants
        run: python -m pytest -p no:cacheprovider -q tests/invariants

      - name: decision replay is identical
        run: python -m mizan.replay --all --assert-identical

      - name: fingerprint matches the committed reference
        run: python scripts/determinism_fingerprint.py --check determinism-reference.json --env

      # The same fingerprint under a deliberately hostile environment. Hash randomisation changes map
      # iteration order; a comma-decimal locale breaks naive number formatting; a far-east timezone
      # shifts any timestamp that was not handled as an explicit input.
      - name: fingerprint under hostile environment
        env:
          PYTHONHASHSEED: '0'
          TZ: 'Pacific/Kiritimati'
          LC_ALL: 'C'
        run: python scripts/determinism_fingerprint.py --check determinism-reference.json --env

      - name: fingerprint under randomised hash seed
        env:
          PYTHONHASHSEED: random
        run: python scripts/determinism_fingerprint.py --check determinism-reference.json --env

      - name: emit this runner's fingerprint
        if: always()
        run: python scripts/determinism_fingerprint.py --out fingerprint-${{ matrix.os }}-${{ matrix.python }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint-${{ matrix.os }}-py${{ matrix.python }}
          path: fingerprint-*.json

  # Every runner above compared itself to the SAME committed reference, so agreement with the
  # reference is agreement with each other. This job makes that explicit rather than implied.
  compare:
    name: all runners agree
    needs: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: fingerprints
      - name: every runner produced the reference fingerprint
        shell: bash
        run: |
          expected=$(python -c "import json;print(json.load(open('determinism-reference.json'))['fingerprint'])")
          echo "reference: $expected"
          status=0
          while IFS= read -r file; do
            actual=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['fingerprint'])" "$file")
            if [ "$actual" = "$expected" ]; then
              echo "  OK      $file"
            else
              echo "  DIFFERS $file -> $actual"
              status=1
            fi
          done < <(find fingerprints -name 'fingerprint-*.json' | sort)
          exit $status
