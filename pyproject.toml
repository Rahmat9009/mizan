# Mizan core — packaging, test, lint and type-check configuration.
# Owner: L0 infra. Changes go through ledger/requests.md.
#
# Determinism (Master Plan C6 / A1): the three libraries that touch canonical
# serialisation and validation are pinned EXACTLY. Their versions are recorded
# in every DecisionRecord.library_versions, so an unpinned upgrade would change
# the recorded provenance of every decision. Bump them deliberately, in one
# commit, with a replay run.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-core"
version = "0.1.0"
description = "Deterministic, replayable, hash-chained pre-trade governance layer between AI trading agents and a broker (paper only)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mizan" }]
keywords = ["trading", "governance", "risk", "audit", "paper-trading"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial",
  "Private :: Do Not Upload",
]
dependencies = [
  # --- exact pins: decision-path libraries (C6) ---
  "pydantic==2.13.4",
  "jsonschema==4.26.0",
  "PyYAML==6.0.2",
  # --- ranges: transport and integration layers ---
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "alpaca-py>=0.43.5,<0.44",
  "openai>=1.100,<3",
]

[project.optional-dependencies]
# The advisory (LLM) adapter is optional by design: the deterministic engine
# must evaluate and reject with no LLM installed at all (Hard Rule E8).
advisory = ["anthropic>=0.77,<2"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5",
  "hypothesis>=6.100,<7",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3",
]

[project.urls]
Repository = "https://github.com/Rahmat9009/Mizan-"

[tool.setuptools.packages.find]
where = ["."]
include = ["mizan*"]
namespaces = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --import-mode=importlib: several lanes add tests/<lane>/test_*.py concurrently
# and basenames collide (tests/policy/test_policy.py vs tests/contracts/test_policy.py).
# importlib mode makes each file's module name unique so no lane can break
# collection for another. Consequence: test modules must not import each
# other; put shared helpers in tests/fixtures/ or a conftest.py.
addopts = "-p no:cacheprovider -ra --import-mode=importlib"
markers = [
  "invariant: Hard Rule invariant from Master Plan §4 (tests/invariants; read-only after the S1 freeze)",
  "security: security test (tests/security; L5)",
  "integration: integration test that may need external services or Docker (tests/integration; L6)",
  "contract: contract conformance test against contracts/*.schema.json (tests/contracts; L0)",
]
filterwarnings = [
  "error::DeprecationWarning:mizan.*",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
# extend-exclude keeps ruff's built-in exclusions (.git, .venv*, node_modules,
# build, dist, caches) and adds ours. Legacy code (app/, ui/, demos, probe)
# is a read-only salvage reference and is not linted.
extend-exclude = [
  ".worktrees",
  "app",
  "ui",
  "demo_*.py",
  "probe_featherless.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["mizan", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # assert False is fine in tests

# ---------------------------------------------------------------------------
# mypy (mizan/ only; legacy app/ is not type-checked)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["mizan"]
plugins = ["pydantic.mypy"]
# strict-ish: everything in --strict except the two flags that fight pydantic
# model_validator signatures and third-party stubs.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
disallow_any_generics = true
disallow_subclassing_any = false
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_return_any = true
warn_no_return = true
show_error_codes = true
pretty = true
exclude = ["^mizan/console/"]

[[tool.mypy.overrides]]
module = ["alpaca.*", "openai.*", "anthropic.*", "jsonschema.*", "yaml.*", "dotenv.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["mizan"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
